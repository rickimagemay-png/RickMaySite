<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick May Truthers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Animated GIF Background located in the images folder */
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                  url('images/background.gif') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 2rem 1rem 1rem 1rem;
    }

    /* Central Container */
    .card-container {
      background: rgba(20, 20, 25, 0.85);
      padding: 3.5rem 3rem;
      border-radius: 20px;
      text-align: center;
      max-width: 650px;
      width: 95%;
      backdrop-filter: blur(8px);
      margin: auto 0;
      
      /* Glowing Border Effect */
      border: 2px solid transparent;
      background-clip: padding-box;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.35),
                  inset 0 0 20px rgba(0, 229, 255, 0.15);
      position: relative;
    }

    .card-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #00e5ff, #ff007f, #7928ca, #00e5ff);
      border-radius: 22px;
      z-index: -1;
      background-size: 300% 300%;
      animation: borderGlow 6s ease infinite;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .intro-text {
      font-size: 1rem;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 2rem;
    }

    /* Button Group Sizing */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #00e5ff;
      color: #000;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Footer Section */
    footer {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 1.5rem 1rem 0.5rem 1rem;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    footer p {
      margin-bottom: 0.4rem;
    }

    footer a {
      color: #00e5ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Background Music from sounds folder -->
  <audio id="bg-music" loop>
    <source src="sounds/background-music.mp3" type="audio/mpeg">
  </audio>

  <!-- Main Content Box -->
  <div class="card-container">
    <h1>Rick May Truthers</h1>
    
    <p class="intro-text">
      Welcome to the official hub. Explore the archives, uncover the hidden sound bytes, and press the modules below to trigger custom audio transmissions.
    </p>

    <div class="button-group">
      <button class="btn" onclick="playAndNavigate('good', 'good.html')">The Good</button>
      <button class="btn" onclick="playAndNavigate('bad', 'bad.html')">The Bad</button>
      <button class="btn" onclick="playAndNavigate('rick', 'rick.html')">The Rick</button>
    </div>
  </div>

  <!-- Footer Blurb & Contact Info -->
  <footer>
    <p>Dedicated to preserving the truth and honoring legacy through sound.</p>
    <p>Contact us: <a href="mailto:contact@rickmaytruthers.com">contact@rickmaytruthers.com</a></p>
  </footer>

  <script>
    // Start background music on first click
    const bgMusic = document.getElementById('bg-music');
    document.body.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().catch(err => console.log("Background music blocked:", err));
      }
    }, { once: true });

    // Audio file locations pointing to the sounds folder
    const soundFiles = {
      good: 'sounds/good.mp3',
      bad: 'sounds/bad.mp3',
      rick: 'sounds/rick.mp3'
    };

    function playAndNavigate(type, targetUrl) {
      const filePath = soundFiles[type];
      
      if (filePath) {
        const audio = new Audio(filePath);
        audio.currentTime = 0;
        audio.play().catch(error => console.log("Audio playback error:", error));

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 300);
      } else {
        window.location.href = targetUrl;
      }
    }
  </script>
</body>
</html>
